services:
  backend:
    build: ./backend
    ports: 
      - 8000:8000
    volumes:
      - ./backend/data:/backend/data

  frontend:
    build: ./frontend
    ports: 
      - 8001:8001
    environment:
      - SENTENCE_SERVICE_URL=http://backend:8000/v1/extract-sentences
    depends_on:
      - backend    